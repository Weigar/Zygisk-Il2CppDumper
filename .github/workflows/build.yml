name: Build
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      package_name:
        description: "請輸入遊戲包名 (例如: com.example.game):"
        required: true
        default: "com.example.game"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4   # 升級到 v4
      with:
        submodules: recursive

    - name: Set up JDK 17        # 升級 JDK 以符合最新 Gradle
      uses: actions/setup-java@v4 # 升級到 v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Modify Package Name and Build
      run: |
        chmod +x ./gradlew
        # 修改 module.gradle 裡的敘述
        sed -i "s/moduleDescription = \"/moduleDescription = \"(${{ github.event.inputs.package_name }}) /g" module.gradle
        # 修改 game.h 裡的目標包名
        sed -i "s/GamePackageName = \".*\"/GamePackageName = \"${{ github.event.inputs.package_name }}\"/g" module/src/main/cpp/game.h
        ./gradlew :module:assembleRelease

    - name: Upload Artifact
      uses: actions/upload-artifact@v4 # 關鍵修復：升級到 v4
      with:
        name: zygisk-il2cppdumper-${{ github.event.inputs.package_name }}
        path: out/*.zip
