name: Build
on:
  push:
    branches: [ master ]
  pull_request:    
    branches: [ master ]
  workflow_dispatch:
    inputs:
      package_name:
        description: "請輸入遊戲包名:"
        required: true
        default: "com.percent.aos.cooptd"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Modify and Build
      run: |
        chmod +x ./gradlew
        # 設定目標遊戲包名
        sed -i "s/GamePackageName = \".*\"/GamePackageName = \"${{ github.event.inputs.package_name }}\"/g" module/src/main/cpp/game.h
        
        # 執行編譯
        ./gradlew :module:assembleRelease
        
        # --- 手動打包 Magisk 格式 ---
        mkdir -p out/magisk_module
        cp -r template/magisk_module/* out/magisk_module/
        
        # 找尋編譯出來的 so 檔並放入模組 (相容多種路徑)
        mkdir -p out/magisk_module/zygisk
        find module/build/intermediates/cmake/release -name "libexample.so" -exec cp {} out/magisk_module/zygisk/ \;
        
        # 重新命名 so 檔以符合 Zygisk 規範 (簡單處理)
        mv out/magisk_module/zygisk/libexample.so out/magisk_module/zygisk/arm64-v8a.so 2>/dev/null || true
        
        # 打包
        cd out/magisk_module && zip -r ../final_module.zip ./*

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Magisk-Dumper-${{ github.event.inputs.package_name }}
        path: out/final_module.zip
